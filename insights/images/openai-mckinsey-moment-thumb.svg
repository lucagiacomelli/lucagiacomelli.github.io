<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0a0a"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="#1a1a2e" stroke-width="1"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#1a1a2e" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="450" stroke="#1a1a2e" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="450" stroke="#1a1a2e" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="450" stroke="#1a1a2e" stroke-width="1"/>

  <!-- Converging arrows — AI model vendor → professional services -->
  <!-- Left node: model vendor circle -->
  <circle cx="160" cy="225" r="52" fill="none" stroke="#1D4ED8" stroke-width="2" opacity="0.6"/>
  <circle cx="160" cy="225" r="38" fill="none" stroke="#1D4ED8" stroke-width="1" opacity="0.3"/>
  <circle cx="160" cy="225" r="8" fill="#1D4ED8" opacity="0.9"/>

  <!-- Right node: consulting firm circle -->
  <circle cx="640" cy="225" r="52" fill="none" stroke="#475569" stroke-width="2" opacity="0.5"/>
  <circle cx="640" cy="225" r="38" fill="none" stroke="#475569" stroke-width="1" opacity="0.3"/>
  <circle cx="640" cy="225" r="8" fill="#475569" opacity="0.9"/>

  <!-- Converging arrows pointing to center -->
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1D4ED8" opacity="0.8"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569" opacity="0.8"/>
    </marker>
  </defs>
  <line x1="220" y1="225" x2="360" y2="225" stroke="#1D4ED8" stroke-width="1.5" opacity="0.7" marker-end="url(#arrow-blue)"/>
  <line x1="580" y1="225" x2="440" y2="225" stroke="#475569" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow-gray)"/>

  <!-- Center collision/merge zone -->
  <circle cx="400" cy="225" r="28" fill="#1D4ED8" opacity="0.15"/>
  <circle cx="400" cy="225" r="16" fill="#1D4ED8" opacity="0.3"/>
  <circle cx="400" cy="225" r="6" fill="#60a5fa" opacity="0.9"/>

  <!-- Outer ring pulsing effect -->
  <circle cx="400" cy="225" r="44" fill="none" stroke="#1D4ED8" stroke-width="1" opacity="0.2"/>
  <circle cx="400" cy="225" r="60" fill="none" stroke="#1D4ED8" stroke-width="0.5" opacity="0.1"/>

  <!-- Labels -->
  <text x="160" y="295" text-anchor="middle" font-size="11" fill="#60a5fa" font-weight="500" letter-spacing="0.06em" opacity="0.8">AI VENDOR</text>
  <text x="640" y="295" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="500" letter-spacing="0.06em" opacity="0.8">CONSULTING</text>

  <!-- Dollar figure -->
  <text x="400" y="130" text-anchor="middle" font-size="42" fill="#1D4ED8" font-weight="700" opacity="0.9">$4B</text>
  <text x="400" y="155" text-anchor="middle" font-size="11" fill="#475569" letter-spacing="0.1em">DEPLOYMENT COMPANY</text>

  <!-- Main title -->
  <text x="400" y="355" text-anchor="middle" font-size="18" fill="#ffffff" font-weight="600" letter-spacing="-0.01em">OpenAI's McKinsey Moment</text>
  <text x="400" y="378" text-anchor="middle" font-size="12" fill="#475569" letter-spacing="0.04em">STRATEGY · MAY 2026</text>

  <!-- Corner accent lines -->
  <line x1="0" y1="0" x2="60" y2="0" stroke="#1D4ED8" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="0" x2="0" y2="60" stroke="#1D4ED8" stroke-width="2" opacity="0.4"/>
  <line x1="800" y1="450" x2="740" y2="450" stroke="#1D4ED8" stroke-width="2" opacity="0.4"/>
  <line x1="800" y1="450" x2="800" y2="390" stroke="#1D4ED8" stroke-width="2" opacity="0.4"/>
</svg>
