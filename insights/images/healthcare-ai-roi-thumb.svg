<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060912;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c1528;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#131d35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1525;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- ── LEFT SIDE: Stacked clinical documents ── -->

  <!-- Doc shadow / depth (card 3, furthest back) -->
  <rect x="72" y="88" width="210" height="274" rx="6" fill="#0d1525" opacity="0.9"/>
  <rect x="72" y="88" width="210" height="274" rx="6" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.4"/>

  <!-- Doc card 2 -->
  <rect x="82" y="78" width="210" height="274" rx="6" fill="#111b30" opacity="0.95"/>
  <rect x="82" y="78" width="210" height="274" rx="6" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.5"/>

  <!-- Doc card 1 (front, main) -->
  <rect x="92" y="68" width="210" height="274" rx="6" fill="url(#cardGrad)"/>
  <rect x="92" y="68" width="210" height="274" rx="6" fill="none" stroke="#2a4a7f" stroke-width="1"/>

  <!-- Document header strip -->
  <rect x="92" y="68" width="210" height="36" rx="6" fill="#1a2d52"/>
  <rect x="92" y="92" width="210" height="12" fill="#1a2d52"/>

  <!-- Header label in document -->
  <text x="112" y="91" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#60a5fa">CLINICAL NOTE</text>

  <!-- Text lines inside document (simulating typed content) -->
  <rect x="112" y="118" width="140" height="5" rx="2" fill="#1e3a5f" opacity="0.9"/>
  <rect x="112" y="131" width="170" height="5" rx="2" fill="#1e3a5f" opacity="0.7"/>
  <rect x="112" y="144" width="155" height="5" rx="2" fill="#1e3a5f" opacity="0.7"/>
  <rect x="112" y="157" width="162" height="5" rx="2" fill="#1e3a5f" opacity="0.5"/>

  <!-- Section divider -->
  <rect x="112" y="175" width="170" height="1" rx="1" fill="#1e3a5f" opacity="0.4"/>

  <!-- Second block of lines -->
  <rect x="112" y="187" width="135" height="5" rx="2" fill="#1e3a5f" opacity="0.9"/>
  <rect x="112" y="200" width="165" height="5" rx="2" fill="#1e3a5f" opacity="0.7"/>
  <rect x="112" y="213" width="148" height="5" rx="2" fill="#1e3a5f" opacity="0.7"/>
  <rect x="112" y="226" width="158" height="5" rx="2" fill="#1e3a5f" opacity="0.5"/>
  <rect x="112" y="239" width="120" height="5" rx="2" fill="#1e3a5f" opacity="0.5"/>

  <!-- Section divider -->
  <rect x="112" y="257" width="170" height="1" rx="1" fill="#1e3a5f" opacity="0.4"/>

  <!-- Third block -->
  <rect x="112" y="269" width="145" height="5" rx="2" fill="#1e3a5f" opacity="0.9"/>
  <rect x="112" y="282" width="168" height="5" rx="2" fill="#1e3a5f" opacity="0.7"/>
  <rect x="112" y="295" width="130" height="5" rx="2" fill="#1e3a5f" opacity="0.5"/>

  <!-- "Generated by AI" chip at bottom of document -->
  <rect x="112" y="318" width="110" height="18" rx="9" fill="#1d4ed8" opacity="0.2"/>
  <rect x="112" y="318" width="110" height="18" rx="9" fill="none" stroke="#1d4ed8" stroke-width="0.75" opacity="0.6"/>
  <text x="167" y="331" font-family="system-ui,-apple-system,sans-serif" font-size="9" font-weight="500" fill="#60a5fa" text-anchor="middle" letter-spacing="0.5">✦ generated by AI</text>

  <!-- Blinking cursor effect (static) -->
  <rect x="112" y="295" width="2" height="9" rx="1" fill="#3b82f6" opacity="0.9"/>

  <!-- ── ARROW / DIVIDER ── -->
  <line x1="340" y1="60" x2="340" y2="420" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- AI spark icon in the middle -->
  <circle cx="340" cy="205" r="22" fill="#0f172a" stroke="#1d4ed8" stroke-width="1"/>
  <text x="340" y="212" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#3b82f6" text-anchor="middle">✦</text>

  <!-- ── RIGHT SIDE: Title ── -->
  <text x="376" y="118" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#3b82f6">HEALTHCARE × AI</text>

  <!-- Main title -->
  <text x="376" y="162" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" fill="#f1f5f9">Clinical</text>
  <text x="376" y="202" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" fill="#f1f5f9">Documentation</text>

  <!-- Subtitle -->
  <text x="376" y="244" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="400" fill="#64748b">The notes that didn't</text>
  <text x="376" y="265" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="400" fill="#64748b">need a human to write</text>

  <!-- Stat pills -->
  <rect x="376" y="294" width="126" height="26" rx="13" fill="rgba(29,78,216,0.12)" stroke="#1d4ed8" stroke-width="0.75" stroke-opacity="0.5"/>
  <text x="439" y="311" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">Kaiser · 40 hospitals</text>

  <rect x="376" y="328" width="155" height="26" rx="13" fill="rgba(29,78,216,0.12)" stroke="#1d4ed8" stroke-width="0.75" stroke-opacity="0.5"/>
  <text x="453" y="345" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">$3.20 per $1 · 14 mo</text>

  <!-- Bottom accent line -->
  <rect x="0" y="432" width="800" height="2" rx="1" fill="url(#blueGrad)" opacity="0.5"/>
</svg>
